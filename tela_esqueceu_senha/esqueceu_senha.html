<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Liepedia - Recuperar senha</title>
</head>

<body>   
     <img 
        src="..\Imagens\logo1.png" 
        class="Logo"
        alt="">
  <main>
        <div class="FundoEsqueceuSenha">
            <section class="CaixaCadastro">
                <h1 class="TituloEsqueceuSenha">Esqueceu a senha?</h1>
                <p class="Subtitulo">Informe o e-mail da sua conta. Enviamos um link para você criar uma nova senha</p>
                <form class="FormulárioEsqueceuSenha" id="FormEsqueceuSenha">
                    <label class="Textemail" for="Email">Email:</label>
                    <input
                        type="email"
                        class="LabelEmail"
                        id="email"
                        required
                        name="email"
                        placeholder="seu@email.com"
                        autocomplete="email"
                        >
                    <button type="submit" class="BtnEnviar">Enviar link</button>
                    <p class="MensagemErro" id="MensagemErro"></p>
                    <p class="MensagemSucesso" id="MensagemSucesso"></p>
                </form>
                <div class="linkLoginDiv">
                    <a class="LinkLogin" href="">Voltar para o login</a>
                </div>
            </section>
        </div>
    </main>

    <script src="script.js"></script>

    <img 
        src="..\Imagens\logo1.png" 
        class="Logo1"
        alt="">
</body>
