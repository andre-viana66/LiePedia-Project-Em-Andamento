<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Liepedia - Cadastro</title>
</head>

<body>   
     <img 
        src="../Imagens/logo1.png" 
        class="Logo"
        alt="">   
    <main>
        <div class="Fundo">
            <section class="CaixaCadastro">
                <h1 class="TituloCaixa">Criar conta</h1>
                <p class="SubtituloCaixa">Junte-se à enciclopédia das mentiras</p>

                <form id="FormCadastro" novalidate>
                        
                    <label class="TexUsuario" for="usuario">Usuário</label>
                    <input 
                        type="text"
                        id="usuario" 
                        placeholder="Seu nome de usuário"
                        required
                        name="usuario"
                        autocomplete="username">


                    <label class="TextEmail" for="email">E-mail</label>
                    <input
                        type="email"
                        required
                        id="email"
                        placeholder="seu@email.com"
                        name="email"
                        autocomplete="email">

                    <label class="TextSenha" for="senha">Senha</label>

                    <div class="LabelOlhosFechadosSenha">

                        <input 
                            type ="password"
                            required
                            id="senha" 
                            placeholder="Crie uma senha" 
                            name="senha"
                            autocomplete="new-password"
                            aria-describedby="DicaSenha">

                        <button
                            type="button"
                            class="BotaoOlho"
                            id="BotaoOlhoSenha"
                            aria-label="Mostrar senha"
                            aria-pressed="false">
                            <img
                                src="../Imagens/icons_olho_fechado.png"
                                class="Icon_Olhos_Fechados_Senha"
                                alt=""
                                id="Icon_Olhos_Fechados_Senha">
                        </button>

                    </div>
                    <p class="DicaSenha" id="DicaSenha">Use pelo menos 8 caracteres, com letra maiúscula, letra minúscula, número e caractere especial.</p>


                    <label class="TextConfirmarSenha" for="confirmar-senha">Confirmar senha</label>

                    <input 
                        type="password"
                        required
                        id="confirmar-senha" 
                        placeholder="Confirme sua senha" 
                        name="confirmar-senha"
                        autocomplete="new-password">


                    <button type="submit" id="BtnEnviar">Cadastrar</button>
                
                    <p class="MensagemDeErro" id="MensagemErro" role="alert"></p>

                </form>

                <p class="TextoEntrar">
                    Já tem uma conta? 
                    <a href="../tela_login/login-index.html" class="EntrarLink">
                        Entrar</a></p>
            </section>

            <img 
                src="../Imagens/logo1.png" 
                class="LogoMax" 
                alt="Logo do Liepedia">
        </div>
    </main>

    <script src="script.js"></script>

</body>
</html>
