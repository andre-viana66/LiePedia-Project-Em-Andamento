<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Liepedia - Cadastro</title>
</head>

</body>
    <head>
        <img 
            src="\Users\pqgam\OneDrive\Documentos\LiePedia Project\Imagens\logo1.png" 
            class="Logo"
            alt="">
    </head>
    <main>
        <div class="Fundo">
            <section class="CaixaCadastro">
                <h1 class="TituloCaixa">Criar Conta</h1>
                <p class="SubtituloCaixa">Junte-se à enciclopédia das mentiras</p>

                <form>
                        
                    <label class="TexUsuario" for="usuario">usuario:</label>
                    <input 
                        type="Text"
                        id="usuario" 
                        placeholder="Seu nome de usuário" 
                        required
                        name="usuario"
                        autocomplete="username">


                    <label class="TextEmail" for="email">Email:</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="seu@email.com"
                        required
                        name="email"
                        autocomplete="email">

                <label class="TextSenha" for="senha">Senha:</label>

                <input 
                    type ="password" 
                    id="senha" 
                    placeholder="Crie uma senha" 
                    required
                    name="senha">



                <label class="TextConfirmarSenha" for="confirmar-senha">Confirmar senha:</label>

                <input 
                    type="password" 
                    id="confirmar-senha" 
                    placeholder="Confirme sua senha" 
                    required
                    name="confirmar-senha">


                <button type="Submit">Cadastrar</button>

            </form>
                <p class="TextoEntrar">
                    Já tem uma conta? 
                    <a href="#" class="EntrarLink">
                        Entrar</a></p>
            </section>

            <img 
                src="\Users\pqgam\OneDrive\Documentos\LiePedia Project\Imagens\logo1.png" 
                class="LogoMax" 
                alt="Logo do Liepedia">
        </div>
    </main>
</body>
</html>
