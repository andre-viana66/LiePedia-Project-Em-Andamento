<body>
    <head>
        <img 
            src ="\Users\pqgam\OneDrive\Documentos\LiePedia Project\Imagens\logo1.png" 
            class = "logo" 
            alt="">
    </head>

        <main>

            <div class="conteiner">
                <section class="caixa">
                    <h1 class="TituloPrimario">Entrar</h1>

                    <p class="Subtitulo">Entre na sua conta para continuar.</p>


                    <form>

                        <label class="TextEmail" for="email">E-mail:</label>

                        <input 
                            type="email" 
                            id="email" 
                            placeholder="seu@e-mail.com"
                            autocomplete="email"
                            required
                            name="email">


                        <label class="TextUsuario" for="senha">Senha:</label>

                        <input 
                            type="password" 
                            id="senha" 
                            placeholder="Digite sua senha" 
                            name="senha"
                            required>


                        <a class="RefazerSenhaLink" href="#">Esqueceu sua senha?</a>
                        <button type="submit">Entrar</button>

                    </form>

                    <p class="TextoCadastro">
                        Não tem uma conta? 
                        <a href="#" class="FazerCadastroLink">
                            Cadastra-se</a></p>

                </section>

                    <img 
                        src="\Users\pqgam\OneDrive\Documentos\LiePedia Project\Imagens\logo1.png" 
                        class="LogoMax" 
                        alt="Logo do Liepedia">
            </div>
    </main>
