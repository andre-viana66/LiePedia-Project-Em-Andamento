<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Liepedia</title>
</head>
<body>
    <img src ="Imagens/logo1.png" class = "logo">
    <div class="conteiner">
        <div class="caixa">
            <h1 class="TituloPrimario">Entrar</h1>
            <p class="Subtitulo">Entre na sua conta para continuar.</p>
            <p class="TextEmail">E-mail:</p>
            <input type="email" id="E-mail" placeholder="seu@e-mail.com">
            <p class="TextUsuario">Usuário:</p>
            <input type="password" id="Senha" placeholder="Digite sua senha">
            <a class="RefazerSenhaLink" href="#"><br>Esqueceu sua senha?<br></a>
            <button type="submit">Entrar</button>
            <p class="TextoCadastro">Não tem uma conta? <a href="#" class="FazerCadastroLink">Cadastra-se</a></p>
        </div>

        <img src="Imagens/logo1.png" class="LogoMax">
    </div>
</body>   
</html>
