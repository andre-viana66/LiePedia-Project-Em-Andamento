<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Liepedia - Login</title>
</head>


<body>

    <img 
        src ="..\Imagens\logo1.png" 
        class = "logo" 
        alt="">

        <main>

            <div class="conteiner">
                
                <section class="caixa">
                    <h1 class="TituloPrimario">Entrar</h1>

                    <p class="Subtitulo">Entre na sua conta para continuar.</p>
                    
                    <form id="FormularioLogin">

                        <label class="TextEmail" for="email">E-mail:</label>
                    
                        <input 
                            type="email" 
                            id="email" 
                            placeholder="seu@e-mail.com"
                            autocomplete="email"
                            name="email"
                            required
                            >


                        <label class="TextUsuario" for="senha">Senha:</label>

                        <div class="Label_senha">
                            <input 
                                type="password" 
                                id="senha" 
                                placeholder="Digite sua senha" 
                                name="senha"
                                required>
                            <img
                                src="../Imagens/icons_olho_fechado.png"
                                class="icon_olhos_abertos"
                                id="iconeOlho"
                                alt="Visualizar senha">
                        </div>


                        <a class="RefazerSenhaLink" href="#">Esqueceu sua senha?</a>
                        <button type="submit">Entrar</button>

                        <p class="MensagemVaziaLogin" id="MensagemVaziaLogin"></p>

                    </form>

                    <p class="TextoCadastro">
                        Não tem uma conta? 
                        <a href="../tela_cadastro/cadastro-index.html" class="FazerCadastroLink">
                            Cadastra-se</a></p>

                </section>

                    <img 
                        src ="..\Imagens\logo1.png" 
                        class="LogoMax" 
                        alt="Logo do Liepedia">
            </div>

        <script src="script.js"></script>

    </main>
</body>   
</html>
